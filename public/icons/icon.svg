<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background Circle with thick toy outline -->
  <rect x="6" y="6" width="108" height="108" rx="34" fill="#7ed957" stroke="#181d14" stroke-width="7"/>
  <!-- Shadow offset -->
  <path d="M12 90 Q 60 114 108 90" stroke="#56c927" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Revy Sprout Body -->
  <circle cx="60" cy="65" r="32" fill="#ffffff" stroke="#181d14" stroke-width="6"/>
  
  <!-- Leafy Sprout on top -->
  <path d="M60 34 C 60 22, 76 18, 78 28 C 80 38, 62 36, 60 34 Z" fill="#56c927" stroke="#181d14" stroke-width="4"/>
  <path d="M60 34 C 60 24, 46 20, 44 30 C 42 40, 58 36, 60 34 Z" fill="#7ed957" stroke="#181d14" stroke-width="4"/>

  <!-- Big Cartoon Sparkly Eyes -->
  <ellipse cx="48" cy="62" rx="6" ry="8" fill="#181d14"/>
  <ellipse cx="72" cy="62" rx="6" ry="8" fill="#181d14"/>
  <!-- Eye highlights -->
  <circle cx="46" cy="59" r="2.5" fill="#ffffff"/>
  <circle cx="50" cy="65" r="1.2" fill="#ffffff"/>
  <circle cx="70" cy="59" r="2.5" fill="#ffffff"/>
  <circle cx="74" cy="65" r="1.2" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="39" cy="69" rx="4.5" ry="3" fill="#ff7556" opacity="0.85"/>
  <ellipse cx="81" cy="69" rx="4.5" ry="3" fill="#ff7556" opacity="0.85"/>

  <!-- Cheerful Smile -->
  <path d="M54 68 Q 60 76 66 68" stroke="#181d14" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Star Sparkles -->
  <path d="M98 28 L100 22 L102 28 L108 30 L102 32 L100 38 L98 32 L92 30 Z" fill="#ffde59" stroke="#181d14" stroke-width="2.5"/>
</svg>
